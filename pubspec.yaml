name: skyeloop
description: Offline-first photobooth kiosk for Skye Loop Vendo.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  crypto: ^3.0.7
  file_picker: ^10.3.10
  image: ^4.9.1
  path: ^1.9.1
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.5
  shelf: ^1.4.2
  shelf_router: ^1.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default_branding/
